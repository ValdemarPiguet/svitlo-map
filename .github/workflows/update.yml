name: Update outage data

on:
  schedule:
    # РЕЗЕРВНИЙ розклад. Основний запуск робить Cloudflare Worker о :17 (див. worker/SETUP.md),
    # а це страховка, якщо Worker не спрацював. Час у UTC: 03:47, 11:47, 18:47, 21:47
    # = 06:47, 14:47, 21:47 і 00:47 за Києвом влітку (взимку на годину раніше).
    - cron: '47 3,11,18,21 * * *'
  workflow_dispatch:   # кнопка «Run workflow» для ручного оновлення
    inputs:
      backfill:
        description: 'Заповнити історію за N минулих днів (0 = не потрібно)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill }}
        run: node scripts/fetch-ua.mjs data/ua.json
      - name: Commit changes
        run: |
          git config user.name "svitlo-bot"
          git config user.email "svitlo-bot@users.noreply.github.com"
          git add data/ua.json data/history.json
          if git diff --cached --quiet; then echo "Без змін"; else git commit -m "Оновлення даних $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M') (Київ)" && git pull --rebase && git push; fi
